    console.log('✅ Terminal aberto');
};

<script>
// === VARIÁVEIS GLOBAIS ===
let currentAssistant = 'Ana';
let conversationHistory = [];

// === CARREGAMENTO DE ASSISTENTES ===
async function loadAssistants() {

        console.log("ASSISTENTES:", assistants.length);
        
        const container = document.getElementById('assistants-container');
        container.innerHTML = '';
        
        assistants.forEach(agent => {
            const card = document.createElement('div');

            card.style.borderLeftColor = agent.color || '#4caf50';
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${agent.display_name || agent.name}</div>
                    <div>${agent.icon || ''}</div>
                </div>
                <div class="card-category">${agent.profile === 'custom' ? 'PERSONALIZADO' : 'GERAL'}</div>
                <div class="card-desc">${(agent.description || agent.prompt || '').substring(0, 100)}...</div>
            `;
            card.onclick = () => openChat(agent.display_name || agent.name);
            container.appendChild(card);
        });
        
        // Card de VMs
        const vmCard = document.createElement('div');
        vmCard.className = 'card';
        vmCard.style.borderLeftColor = '#0db7ed';
        vmCard.innerHTML = `
            <div class="card-header"><div class="card-title">Máquinas Virtuais</div><div><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 4px;">

</svg></div></div>
        
        <!-- Card Dashboard V5.0 -->
            </div>
            <div class="card-category">SISTEMA</div>
        </div>

            <div class="card-category">Virtualização</div>
            <div class="card-desc">Gerencie containers Linux diretamente pelo ThinkinOS.</div>
        `;
        vmCard.onclick = openVMManager;
        container.appendChild(vmCard);
        
        console.log("Total de cards:", document.querySelectorAll('.card').length);
    } catch (e) {
        console.error("Erro ao carregar assistentes:", e);
    }
}

// === SISTEMA DE CHAT ===
function openChat(assistant) {
    console.log("Abrindo chat com:", assistant);
    currentAssistant = assistant;
    loadChatHistory(assistant); // V3.1: Carregar histórico
    conversationHistory = [];
    document.getElementById('chat-assistant-name').textContent = assistant;
    document.getElementById('chat-modal').classList.add('active');
    document.getElementById('chat-overlay').classList.add('active');
    document.getElementById('chat-messages').innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Conversando com ' + assistant + '<br><small>Digite uma mensagem para começar</small></div>';
    document.getElementById('chat-input').value = '';
    document.getElementById('chat-input').focus();
}

function closeChatModal() {
    document.getElementById('chat-modal').classList.remove('active');
    document.getElementById('chat-overlay').classList.remove('active');
}


async function loadChatHistory(assistantName) {
    const messagesDiv = document.getElementById('chat-messages');
    if (!messagesDiv) return;
    
    messagesDiv.innerHTML = '<div style="color: #888; text-align: center; margin-top: 20px;">Carregando histórico...</div>';
    
    try {
        const resp = await fetch(`/api/chat/history/${encodeURIComponent(assistantName)}`);
        const data = await resp.json();
        
        messagesDiv.innerHTML = ''; // Limpar "Carregando..."
        
        if (data.success && data.history.length > 0) {
            data.history.forEach(msg => {
                const align = msg.role === 'user' ? 'right' : 'left';
                const bg = msg.role === 'user' ? '#2196F3' : '#333';
                const color = '#fff';
                // Escapar HTML básico para segurança
                const safeContent = msg.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                messagesDiv.innerHTML += `<div style="margin: 10px 0; text-align: ${align};"><span style="background: ${bg}; color: ${color}; padding: 8px 12px; border-radius: 8px; display: inline-block; max-width: 80%; word-wrap: break-word;">${safeContent}</span></div>`;
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } else {
            messagesDiv.innerHTML = `<div style="color: #888; text-align: center; margin-top: 20px;">Inicie uma nova conversa com ${assistantName}</div>`;
        }
    } catch (e) {
        console.error("Erro ao carregar histórico:", e);
        messagesDiv.innerHTML = '<div style="color: #f44336; text-align: center;">Erro ao carregar histórico</div>';
    }
}

async function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;
    
    const messagesDiv = document.getElementById('chat-messages');
    
    // Adicionar mensagem do usuário
    messagesDiv.innerHTML += '<div style="margin: 10px 0; text-align: right;"><span style="background: #2196F3; color: white; padding: 8px 12px; border-radius: 8px; display: inline-block;">' + message + '</span></div>';
    input.value = '';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    // Adicionar indicador de digitação
    messagesDiv.innerHTML += '<div id="typing-indicator" style="margin: 10px 0; color: #888;">' + currentAssistant + ' está digitando...</div>';
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: message,
                assistant: currentAssistant,
                history: conversationHistory
            })
        });
        const data = await resp.json();
        
        // Remover indicador
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
        
        // Adicionar resposta
        const response = data.response || data.message || 'Sem resposta';
        messagesDiv.innerHTML += '<div style="margin: 10px 0; text-align: left;"><span style="background: #333; color: #fff; padding: 8px 12px; border-radius: 8px; display: inline-block;">' + response + '</span></div>';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Salvar no histórico local (para contexto da IA)
        conversationHistory.push({role: 'user', content: message});
        conversationHistory.push({role: 'assistant', content: response});
        
                fetch('/api/chat/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ assistant_name: currentAssistant, role: 'user', content: message })
        }).catch(e => console.error("Erro ao salvar msg usuário:", e));
        
        fetch('/api/chat/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ assistant_name: currentAssistant, role: 'assistant', content: response })
        }).catch(e => console.error("Erro ao salvar msg IA:", e));
    } catch (e) {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
        messagesDiv.innerHTML += '<div style="color: #f44336;">Erro ao enviar mensagem</div>';
        console.error("Erro no chat:", e);
    }
}

// === GERENCIADOR DE VMs ===
function openVMManager() {
    document.getElementById('vm-modal').classList.add('active');
    document.getElementById('vm-overlay').classList.add('active');
    loadVMs();
}

function closeVMManager() {
    document.getElementById('vm-modal').classList.remove('active');
    document.getElementById('vm-overlay').classList.remove('active');
}

async function startVM(distro) {
    try {
        const resp = await fetch('/api/vm/start/' + distro, { method: 'POST' });
        const data = await resp.json();
        alert(data.message || data.error);
        loadVMs();
    } catch (e) {
        alert("Erro de conexão");
    }
}

async function loadVMs() {
    try {
        console.log("Carregando VMs...");
        const resp = await fetch('/api/vm/containers');
        const vms = await resp.json();
        console.log("VMs recebidas:", vms);
        const listDiv = document.getElementById('vm-list');
        
        if (vms.length === 0) {
            listDiv.innerHTML = '<p style="text-align: center; color: #888;">Nenhuma VM em execução.</p>';
            return;
        }
        
        let html = '';
        vms.forEach(vm => {
            const statusClass = vm.status === 'running' ? 'status-running' : 'status-exited';
            html += `<div class="vm-row">
                <div><strong>${vm.name}</strong><br><small style="color:#888;">${vm.image}</small></div>
                <div class="${statusClass}">● ${vm.status}</div>
                <div>
                    ${vm.status === 'running' ? `<button class="btn" style="background: #00bcd4; color: white; margin-right: 5px;" onclick="openTerminal(\'${vm.id}\', \'${vm.name}\')"">💻 Terminal</button>` : ''}
                    <button class="btn ${vm.status === 'running' ? 'btn-danger' : 'btn-primary'}" 
                        onclick="${vm.status === 'running' ? 'stopVM' : 'startVMById'}('${vm.id}')">
                        ${vm.status === 'running' ? '⏹ Parar' : '▶ Iniciar'}
                    </button>
                </div>
            </div>`;
        });
        listDiv.innerHTML = html;
    } catch (e) {
        document.getElementById('vm-list').innerHTML = '<p style="color: #f44336;">Erro ao carregar</p>';
    }
}

async function stopVM(id) {
    if (!confirm('Parar esta VM?')) return;
    try {
        const resp = await fetch('/api/vm/stop/' + id, { method: 'POST' });
        const data = await resp.json();
        if (data.success) {
            loadVMs();
        } else {
            alert("Erro ao parar: " + (data.error || "Desconhecido"));
            loadVMs();
        }
    } catch (e) {
        alert("Erro de conexão: " + e.message);
    }
}

async function startVMById(id) {
    console.log("Iniciando container:", id);
    const listDiv = document.getElementById('vm-list');
    listDiv.innerHTML = '<p style="text-align: center; color: #0db7ed;">⏳ Iniciando container...</p>';
    
    try {
        const resp = await fetch('/api/vm/start/' + id, { method: 'POST' });
        const data = await resp.json();
        
        if (data.success) {
            console.log("✅ Container iniciado:", data.message);
            loadVMs();
        } else {
            alert("Erro ao iniciar: " + (data.error || "Desconhecido"));
            loadVMs();
        }
    } catch (e) {
        console.error("Erro ao iniciar container:", e);
        alert("Erro de conexão: " + e.message);
        loadVMs();
    }
}

<script>
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        // Estratégia melhorada: procurar pelo container que tem MÚLTIPLOS cards diretos filhos
        // Isso evita pegar containers internos de cards específicos
        let bestContainer = null;
        let maxDirectCards = 0;
        
        const allDivs = document.querySelectorAll('div');
        for (const div of allDivs) {
            // Contar apenas cards que são filhos DIRETOS desta div
            let directCardCount = 0;
            for (const child of div.children) {
                if (child.classList.contains('card')) {
                    directCardCount++;
                }
            }
            
            // Se esta div tem mais cards diretos que a anterior, e tem pelo menos 4 (grid real)
            if (directCardCount > maxDirectCards && directCardCount >= 4) {
                maxDirectCards = directCardCount;
                bestContainer = div;
            }
        }
        
        // Fallback: se não achou grid perfeita, usa o body ou main
        if (!bestContainer) {
            bestContainer = document.querySelector('main') || document.body;
            console.warn("⚠️ Grid não encontrada, usando fallback");

<script>

<script>
// HOT RELOAD INTELIGENTE: Complemento ao Live Preview existente
(function() {
    'use strict';
    
    // Aguardar SocketIO do Live Preview já estar conectado
    setTimeout(() => {
        if (typeof io !== 'undefined') {
            console.log(" [HOT RELOAD] Adicionando handlers inteligentes...");
            
            const hotSocket = io();
            
            hotSocket.on('file_saved', (data) => {
                const filename = data.file;
                const filetype = data.type || (filename.endsWith('.css') ? 'css' : filename.endsWith('.js') ? 'js' : 'html');
                
                // CSS: Atualização dinâmica sem reload
                if (filetype === 'css') {
                    console.log(`🎨 [HOT RELOAD] CSS detectado: ${filename}`);
                    handleCSSUpdate(filename);
                }
                // JS: Execução dinâmica
                else if (filetype === 'js') {
                    console.log(` [HOT RELOAD] JS detectado: ${filename}`);
                    handleJSUpdate(filename);
                }
                // HTML: Deixar o Live Preview existente cuidar do reload
                else if (filetype === 'html') {
                    console.log(` [HOT RELOAD] HTML - Live Preview existente cuidará do reload`);
                }
            });
        }
    }, 1000); // Aguardar 1s para garantir que Live Preview já conectou
    
    function handleCSSUpdate(filename) {
        fetch(`/${filename}?t=${Date.now()}`)
            .then(response => response.text())
            .then(cssText => {
                let styleTag = document.getElementById(`hot-reload-${filename}`);
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = `hot-reload-${filename}`;
                    document.head.appendChild(styleTag);
                }
                styleTag.textContent = cssText;
                console.log(`✅ [CSS] ${filename} atualizado (${cssText.length} bytes)`);
            })
            .catch(err => console.error(`❌ [CSS] Erro: ${err}`));
    }
    
    function handleJSUpdate(filename) {
        fetch(`/${filename}?t=${Date.now()}`)
            .then(response => response.text())
            .then(jsText => {
                const oldScript = document.getElementById(`hot-reload-${filename}`);
                if (oldScript) oldScript.remove();
                
                const newScript = document.createElement('script');
                newScript.id = `hot-reload-${filename}`;
                newScript.textContent = jsText;
                document.body.appendChild(newScript);
                console.log(`✅ [JS] ${filename} executado`);
            })
            .catch(err => console.error(` [JS] Erro: ${err}`));
    }
})();
</script>

<script>
// === GERENCIADOR DE ARQUIVOS (FILE MANAGER) ===
let fmCurrentPath = '/';

function openFileManager() {
    document.getElementById('file-manager-modal').style.display = 'flex';
    setTimeout(() => { setupDrag('file-manager-modal', 'fm-header'); }, 50);
    
    
    fmCurrentPath = '/';
    fmLoadFiles(fmCurrentPath);
}

function closeFileManager() {
    document.getElementById('file-manager-modal').style.display = 'none';
}

function fmLoadFiles(path) {
    fmCurrentPath = path;
    setTimeout(function() { if(typeof updateBreadcrumb === 'function') updateBreadcrumb(path); }, 100);
    document.getElementById('fm-current-path').textContent = path || '/';
    
    // Atualizar Breadcrumb
    const listContainer = document.getElementById('fm-file-list');
    listContainer.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">Carregando...</div>';
    
    fetch(`/api/fs/list?path=${encodeURIComponent(path)}`)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                listContainer.innerHTML = `<div style="color:#ff6b6b; text-align:center;">Erro: ${data.error}</div>`;
                return;
            }
            
            if (data.items.length === 0) {
                listContainer.innerHTML = '<div style="color:#888; text-align:center; margin-top:50px;">Pasta vazia</div>';
                return;
            }
            
            let html = '<table style="width:100%; border-collapse:collapse;">';
            html += '<tr style="text-align:left; color:#aaa; border-bottom:1px solid rgba(255,255,255,0.1);"><th style="padding:8px;">Nome</th><th style="padding:8px;">Tamanho</th><th style="padding:8px;">Ações</th></tr>';
            
            // Botão para voltar à pasta pai (se não estiver na raiz)
            if (path !== '/') {
                const parentPath = path.split('/').slice(0, -1).join('/') || '/';
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;" ondblclick="fmLoadFiles('${parentPath}')">
                    <td style="padding:10px;"><span style="color:#ffd700;">📁</span> <strong>..</strong></td>
                    <td style="padding:10px; color:#888;">-</td>
                    <td style="padding:10px;"></td>
                </tr>`;
            }
            
            data.items.forEach(item => {
                const icon = item.is_dir ? '📁' : '📄';
                const color = item.is_dir ? '#ffd700' : '#fff';
                const size = item.is_dir ? '-' : (item.size / 1024).toFixed(1) + ' KB';
                
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.05); transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'">
                    <td style="padding:10px; cursor:pointer;" ondblclick="${item.is_dir ? `fmLoadFiles('${item.path}')` : `openFileInEditor('${item.path}')`}">
                        <span style="color:${color}; margin-right:8px;">${icon}</span> ${item.name}
                    </td>
                    <td style="padding:10px; color:#888;">${size}</td>
                    <td style="padding:10px;">
                        <button onclick="fmDelete('${item.path}', ${item.is_dir})" style="background:#cc3333; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Excluir</button>
                        ${!item.is_dir ? `<button onclick="fmDownload('${item.path}')" style="background:#007acc; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px; margin-left:4px;">Baixar</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</table>';
            listContainer.innerHTML = html;
        })
        .catch(err => {
            listContainer.innerHTML = `<div style="color:#ff6b6b; text-align:center;">Erro de rede: ${err}</div>`;
        });
}

function fmCreate(type) {
    const name = prompt(`Nome da ${type === 'dir' ? 'pasta' : 'arquivo'}:`);
    if (!name) return;
    
    fetch('/api/fs/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ path: fmCurrentPath, name: name, is_dir: type === 'dir' })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            fmLoadFiles(fmCurrentPath);
        } else {
            alert('Erro: ' + data.error);
        }
    });
}

function fmDelete(path, isDir) {
    const msg = isDir ? 'Tem certeza que deseja excluir esta pasta e todo o seu conteúdo?' : 'Tem certeza que deseja excluir este arquivo?';
    if (!confirm(msg)) return;
    
    fetch('/api/fs/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ path: path })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            fmLoadFiles(fmCurrentPath);
        } else {
            alert('Erro: ' + data.error);
        }
    });
}

function fmUpload(input) {
    const files = input.files;
    if (!files || files.length === 0) return;
    
    const fileCount = files.length;
    const fileLabel = fileCount === 1 ? 'arquivo' : 'arquivos';
    
    // Feedback visual inicial
    const listContainer = document.getElementById('fm-file-list');
    const originalContent = listContainer.innerHTML;
    listContainer.innerHTML = `<div style="text-align:center; color:#4dabf7; margin-top:50px; font-size:16px;">
        <div style="font-size:48px; margin-bottom:20px;">⬆️</div>
        <div>Enviando ${fileCount} ${fileLabel}...</div>
        <div id="upload-progress" style="margin-top:10px; color:#888;">0 de ${fileCount}</div>
    </div>`;
    
    let uploadedCount = 0;
    let errorCount = 0;
    
    // Processar cada arquivo
    Array.from(files).forEach((file, index) => {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('path', fmCurrentPath);
        
        fetch('/api/fs/upload', {
            method: 'POST',
            body: formData
        })
        .then(resp => resp.json())
        .then(data => {
            uploadedCount++;
            const progressEl = document.getElementById('upload-progress');
            if (progressEl) {
                progressEl.textContent = `${uploadedCount} de ${fileCount}`;
            }
            
            // Se for o último arquivo, recarregar a lista
            if (uploadedCount + errorCount === fileCount) {
                setTimeout(() => {
                    fmLoadFiles(fmCurrentPath);
                }, 500);
            }
        })
        .catch(err => {
            errorCount++;
            console.error(`Erro ao enviar ${file.name}:`, err);
            
            if (uploadedCount + errorCount === fileCount) {
                setTimeout(() => {
                    fmLoadFiles(fmCurrentPath);
                }, 500);
            }
        });
    });
    
    // Limpar o input para permitir reenvio do mesmo arquivo
    input.value = '';
}

function fmDownload(path) {
    window.open(`/api/fs/download?path=${encodeURIComponent(path)}`, '_blank');
}

function openFileInEditor(path) {
    // Se a função do editor existir, chama ela. Senão, abre em nova aba como fallback
    if (typeof openEditor === 'function') {
        closeFileManager();
        openEditor(path);
    } else {
        window.open(`/editor?file=${encodeURIComponent(path)}`, '_blank');
    }
}
</script>

<script>
// === TERMINAL COMPLETO (XTerm.js + Backend API) ===
let term = null;
let fitAddon = null;
let currentSessionId = null;
let pollInterval = null;





function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(() => {
        if (!currentSessionId || document.getElementById('terminal-modal').style.display === 'none') return;
        
        fetch('/api/terminal/read', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ session_id: currentSessionId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success && data.output) {
                term.write(data.output);
            }
        })
        .catch(err => console.error('Erro ao ler terminal:', err));

<script>
// === THINKINOS WINDOW MANAGER V4.0 (LIMPO) ===
let wmZIndex = 10000;

function wmBringToFront(element) {
    if (!element) return;
    wmZIndex++;
    element.style.zIndex = wmZIndex;
}

function wmMakeDraggable(modalId, handleId) {
    const modal = document.getElementById(modalId);
    const handle = document.getElementById(handleId);
    
    if (!modal || !handle) return;
    if (handle.dataset.wmInit === "true") return; // Já inicializado

    modal.style.position = 'fixed';
    modal.style.transform = 'none';
    if (!modal.style.top || modal.style.top === '50%') {
        modal.style.top = '80px';
        modal.style.left = '80px';
    }

    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    handle.style.cursor = 'move';
    handle.style.userSelect = 'none';

    handle.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = modal.offsetLeft;
        initialTop = modal.offsetTop;
        wmBringToFront(modal);
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        modal.style.left = (initialLeft + dx) + 'px';
        modal.style.top = Math.max(40, initialTop + dy) + 'px'; // Não subir mais que 40px
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
    });

    modal.addEventListener('mousedown', () => wmBringToFront(modal));
    handle.dataset.wmInit = "true";
    console.log('✅ Arraste ativado para:', modalId);
}

function initDraggableWindows() {
    wmMakeDraggable('file-manager-modal', 'fm-header');
    wmMakeDraggable('terminal-modal', 'term-header');
}

// Inicializar quando o DOM estiver pronto
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDraggableWindows);
} else {
    initDraggableWindows();
}

function openTerminal(containerId, containerName) {
    window._openTerminalImpl(containerId, containerName);
}
window.openTerminal = openTerminal;

function closeTerminalModal() {
    window._closeTerminalModalImpl();
}
window.closeTerminalModal = closeTerminalModal;

window._openTerminalImpl = function(containerId, containerName) {
    console.log("🔌 openTerminal chamado:", containerId, containerName);
    const modal = document.getElementById("terminal-modal");
    const overlay = document.getElementById("terminal-overlay");
    if (modal) modal.style.display = "flex";
    if (overlay) overlay.style.display = "block";
    
    if (window.terminalTabs.length === 0) {
        setTimeout(function() { window.addTerminalTab(containerName || "Terminal 1"); }, 100);
    }
};

window.addTerminalTab = function(name) {
    console.log("➕ addTerminalTab:", name);
    const tabId = "tab-" + window.tabCounter++;
    const tabsBar = document.getElementById("terminal-tabs-bar");
    const contentArea = document.getElementById("terminal-content-area");
    if (!tabsBar || !contentArea) { console.error("❌ Estrutura do terminal não encontrada"); return; }
    
    const tabEl = document.createElement("div");
    tabEl.className = "terminal-tab";
    tabEl.id = "btn-" + tabId;
    tabEl.innerHTML = "<span>" + name + "</span> <span class='terminal-tab-close' onclick='event.stopPropagation(); window.closeTerminalTab("" + tabId + "")'>×</span>";
    tabEl.onclick = function() { window.switchTerminalTab(tabId); };
    tabsBar.appendChild(tabEl);
    
    const wrapper = document.createElement("div");
    wrapper.className = "terminal-container-wrapper";
    wrapper.id = "term-container-" + tabId;
    wrapper.style.cssText = "position:absolute; top:0; left:0; right:0; bottom:0; display:none; padding: 15px; background: #000; color: #0f0; font-family: monospace; font-size: 14px;";
    wrapper.innerHTML = "<div style='padding:20px; text-align:center;'><div style='font-size:40px; margin-bottom:10px;'>💻</div><div style='color:#00ff00; font-weight:bold; margin-bottom:10px;'>✅ Terminal " + name + " Inicializado</div><div>luperesil@thinkinos:~$ <span style='animation:blink 1s infinite'>_</span></div></div><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}</style>";
    contentArea.appendChild(wrapper);
    window.switchTerminalTab(tabId);
};

window.switchTerminalTab = function(tabId) {
    document.querySelectorAll(".terminal-tab").forEach(function(el) { el.classList.remove("active"); });
    document.querySelectorAll(".terminal-container-wrapper").forEach(function(el) { el.classList.remove("active"); });
    const activeBtn = document.getElementById("btn-" + tabId);
    if (activeBtn) activeBtn.classList.add("active");
    const wrapper = document.getElementById("term-container-" + tabId);
    if (wrapper) { wrapper.style.display = "block"; wrapper.classList.add("active"); }
};

window.closeTerminalTab = function(tabId) {
    const tabIndex = window.terminalTabs.findIndex(function(t) { return t.id === tabId; });
    if (tabIndex === -1) return;
    const btnEl = document.getElementById("btn-" + tabId);
    if (btnEl) btnEl.remove();
    const wrapperEl = document.getElementById("term-container-" + tabId);
    if (wrapperEl) wrapperEl.remove();
    window.terminalTabs.splice(tabIndex, 1);
    if (window.terminalTabs.length > 0) {
        window.switchTerminalTab(window.terminalTabs[Math.max(0, tabIndex - 1)].id);
    } else {
        window.closeTerminalModal();
    }
};

window._closeTerminalModalImpl = function() {
    console.log("❌ closeTerminalModal chamado");
    window.terminalTabs = [];

    const modal = document.getElementById("terminal-modal");
    const overlay = document.getElementById("terminal-overlay");
    if (modal) modal.style.display = "none";
    if (overlay) overlay.style.display = "none";
};
