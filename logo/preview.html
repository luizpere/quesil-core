<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quesil Core - Logo Preview</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px;
            background: #0a0a15;
            color: white;
        }
        .section {
            margin: 40px 0;
            padding: 30px;
            border-radius: 10px;
        }
        .dark-bg { background: #1a1a2e; }
        .light-bg { background: #f5f5f5; color: #333; }
        h2 { margin-top: 0; }
        img { max-width: 100%; height: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>🌌 Quesil Core - Kit de Logo</h1>
    
    <div class="section dark-bg">
        <h2>1. Logo Principal (Circular)</h2>
        <img src="quesil-core-logo.svg" alt="Logo Principal">
    </div>
    
    <div class="section dark-bg">
        <h2>2. Logo Horizontal</h2>
        <img src="quesil-core-horizontal.svg" alt="Logo Horizontal">
    </div>
    
    <div class="section dark-bg">
        <h2>3. Favicon (3 Estrelas)</h2>
        <img src="quesil-favicon.svg" alt="Favicon" style="width: 128px;">
    </div>
    
    <div class="section dark-bg">
        <h2>4. Versão Dark (Fundo Transparente)</h2>
        <img src="quesil-core-dark.svg" alt="Dark Version">
    </div>
    
    <div class="section light-bg">
        <h2>5. Versão Light (Para fundos claros)</h2>
        <img src="quesil-core-light.svg" alt="Light Version">
    </div>
    
    <div class="section dark-bg">
        <h2>6. Versão Animada (CSS)</h2>
        <img src="quesil-core-animated.svg" alt="Animated Version">
    </div>
</body>
</html>
