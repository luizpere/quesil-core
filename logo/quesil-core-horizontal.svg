<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <defs>
    <radialGradient id="starGlowH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#a8c0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Ícone: 3 estrelas com anel -->
  <ellipse cx="75" cy="75" rx="50" ry="18" fill="none" stroke="#667eea" stroke-width="1" transform="rotate(-15 75 75)" opacity="0.6"/>
  <circle cx="50" cy="75" r="8" fill="url(#starGlowH)" filter="url(#softGlowH)"/>
  <circle cx="50" cy="75" r="3" fill="#ffffff" filter="url(#glowH)"/>
  <circle cx="75" cy="75" r="10" fill="url(#starGlowH)" filter="url(#softGlowH)"/>
  <circle cx="75" cy="75" r="4" fill="#ffffff" filter="url(#glowH)"/>
  <circle cx="100" cy="75" r="8" fill="url(#starGlowH)" filter="url(#softGlowH)"/>
  <circle cx="100" cy="75" r="3" fill="#ffffff" filter="url(#glowH)"/>
  <!-- Texto -->
  <text x="150" y="85" font-family="'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="4">QUESIL CORE</text>
  <text x="152" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="300" fill="#a8c0ff" letter-spacing="3">AI ORCHESTRATION PLATFORM</text>
</svg>
