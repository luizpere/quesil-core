<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Construtor de Agentes - ThinkinOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: white;
            padding: 40px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #00bcd4; margin-bottom: 30px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00bcd4; font-weight: bold; }
        input, textarea {
            width: 100%; padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; color: white;
            font-size: 1em; font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none; border-color: #6200ea;
        }
        textarea { min-height: 150px; resize: vertical; }
        
        .btn {
            padding: 12px 30px; background: #6200ea;
            color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1em;
            transition: all 0.3s; margin-right: 10px;
        }
        .btn:hover { background: #7c1dff; transform: translateY(-2px); }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #34d399; }
        
        .agent-list { margin-top: 40px; }
        .agent-item {
            background: rgba(255,255,255,0.05);
            padding: 20px; border-radius: 8px;
            margin-bottom: 15px; border-left: 4px solid #6200ea;
        }
        .agent-name { color: #00bcd4; font-size: 1.3em; font-weight: bold; }
        .agent-icon { font-size: 2em; margin-right: 10px; }
        .agent-prompt { color: #aaa; margin-top: 10px; font-style: italic; }
        .btn-delete {
            background: #ef4444; padding: 8px 15px;
            margin-top: 10px; font-size: 0.9em;
        }
        .btn-delete:hover { background: #f87171; }
        
        .alert {
            padding: 15px; border-radius: 8px;
            margin-bottom: 20px; display: none;
        }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Construtor de Agentes - Teste V3.2</h1>
        
        <div id="alert" class="alert"></div>
        
        <div class="form-group">
            <label>Nome do Agente:</label>
            <input type="text" id="agent-name" placeholder="Ex: Jurídico, Marketing, Nutricionista...">
        </div>
        
        <div class="form-group">
            <label>Ícone (emoji):</label>
            <input type="text" id="agent-icon" placeholder="Ex: ⚖️ 📊  💼" value="">
        </div>
        
        <div class="form-group">
            <label>Prompt do Sistema (Personalidade e Regras):</label>
            <textarea id="agent-prompt" placeholder="Descreva a personalidade, especialidade e regras deste agente..."></textarea>
        </div>
        
        <button class="btn" onclick="createAgent()">💾 Criar Agente</button>
        <a href="/desktop" class="btn btn-success">← Voltar ao Desktop</a>
        
        <div class="agent-list">
            <h2 style="color: #00bcd4; margin-bottom: 20px;">📋 Meus Agentes Personalizados</h2>
            <div id="agents-container">Carregando...</div>
        </div>
    </div>
    
    <script>
        function showAlert(msg, type) {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }
        
        async function createAgent() {
            const name = document.getElementById('agent-name').value.trim();
            const icon = document.getElementById('agent-icon').value.trim() || '🤖';
            const prompt = document.getElementById('agent-prompt').value.trim();
            
            if (!name || !prompt) {
                showAlert('Nome e Prompt são obrigatórios!', 'error');
                return;
            }
            
            try {
                const res = await fetch('/api/custom_agents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, icon, prompt })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showAlert(`✅ Agente "${name}" criado com sucesso!`, 'success');
                    document.getElementById('agent-name').value = '';
                    document.getElementById('agent-prompt').value = '';
                    loadAgents();
                } else {
                    showAlert(`❌ Erro: ${data.error}`, 'error');
                }
            } catch (err) {
                showAlert(' Erro de conexão', 'error');
            }
        }
        
        async function loadAgents() {
            try {
                const res = await fetch('/api/custom_agents');
                const agents = await res.json();
                
                const container = document.getElementById('agents-container');
                
                if (agents.length === 0) {
                    container.innerHTML = '<p style="color: #888; text-align: center;">Nenhum agente personalizado ainda.</p>';
                    return;
                }
                
                container.innerHTML = agents.map(agent => `
                    <div class="agent-item">
                        <div class="agent-name"><span class="agent-icon">${agent.icon}</span>${agent.name}</div>
                        <div class="agent-prompt">${agent.prompt}</div>
                        <button class="btn btn-delete" onclick="deleteAgent(${agent.id})">🗑️ Excluir</button>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('agents-container').innerHTML = '<p style="color: #ef4444;">Erro ao carregar agentes</p>';
            }
        }
        
        async function deleteAgent(id) {
            if (!confirm('Deseja realmente excluir este agente?')) return;
            
            try {
                const res = await fetch(`/api/custom_agents/${id}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (res.ok) {
                    showAlert('✅ Agente excluído!', 'success');
                    loadAgents();
                } else {
                    showAlert(`❌ Erro: ${data.error}`, 'error');
                }
            } catch (err) {
                showAlert('❌ Erro ao excluir', 'error');
            }
        }
        
        // Carregar agentes ao iniciar
        loadAgents();
    </script>
</body>
</html>
