<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ThinkinBrowser</title>
    <style>
        body { 
            background: #0a0a0f; 
            color: #e0e0e0; 
            font-family: monospace; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Barra de Navegação */
        .nav-bar {
            background: #14141e;
            border-bottom: 1px solid #333;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
        }
        .nav-btn:hover { background: #555; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .url-bar {
            flex: 1;
            background: #0a0a0f;
            border: 1px solid #333;
            color: #00ff00;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            outline: none;
        }
        .url-bar:focus { border-color: #00ff00; }
        
        /* Área de Conteúdo */
        .browser-content {
            flex: 1;
            background: #fff;
            border: none;
            width: 100%;
        }
        
        /* Página Inicial */
        .home-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
        }
        .home-page h1 { color: #00ff00; font-size: 48px; margin-bottom: 20px; }
        .home-page p { color: #888; font-size: 18px; }
        .search-box {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            background: #14141e;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
            width: 400px;
            font-family: monospace;
            outline: none;
        }
        .search-input:focus { border-color: #00ff00; }
        .search-btn {
            background: #00ff00;
            border: none;
            color: #000;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
    
        /* Página de Erro Personalizada */
        .error-page {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            text-align: center;
            padding: 40px;
        }
        .error-icon { font-size: 64px; margin-bottom: 20px; }
        .error-title { color: #ff5555; font-size: 24px; margin-bottom: 10px; }
        .error-desc { color: #888; max-width: 500px; line-height: 1.6; margin-bottom: 30px; }
        .error-actions { display: flex; gap: 15px; }
        .btn-primary { 
            background: #00ff00; color: #000; border: none; 
            padding: 10px 20px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; font-family: monospace;
        }
        .btn-secondary { 
            background: transparent; color: #fff; border: 1px solid #555; 
            padding: 10px 20px; border-radius: 4px; cursor: pointer; 
            font-family: monospace;
        }
        .btn-primary:hover { background: #00cc00; }
        .btn-secondary:hover { border-color: #fff; }

    </style>
</head>
<body>
    <!-- Barra de Navegação -->
    <div class="nav-bar">
        <button class="nav-btn" id="btn-back" onclick="goBack()">←</button>
        <button class="nav-btn" id="btn-forward" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="refresh()">⟳</button>
        <button class="nav-btn" onclick="goHome()"></button>
        <input type="text" class="url-bar" id="url-input" placeholder="Digite URL ou busca..." onkeydown="if(event.key==='Enter') navigate()">
        <button class="nav-btn" onclick="navigate()">Ir</button>
    </div>
    
    <!-- Conteúdo (Iframe ou Página Inicial) -->
    <iframe id="browser-frame" class="browser-content" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    
    
    <!-- Página de Erro Personalizada -->
    <div id="error-view" class="error-page">
        <div class="error-icon">🛡️</div>
        <h2 class="error-title">Site Bloqueado para Iframe</h2>
        <p class="error-desc">
            Este site possui proteção de segurança (X-Frame-Options) e não permite ser exibido dentro de janelas incorporadas. 
            Isso é comum em sites como Google, Bancos e Redes Sociais.
        </p>
        <div class="error-actions">
            <button class="btn-primary" onclick="openExternal()"> Abrir no Navegador Externo</button>
            <button class="btn-secondary" onclick="goHome()">🏠 Voltar ao Início</button>
        </div>
    </div>

    <div id="home-view" class="home-page">
        <h1>🌐 ThinkinBrowser</h1>
        <p>Navegador integrado ao ThinkinOS V5.0</p>
        <div class="search-box">
            <input type="text" class="search-input" id="search-input" placeholder="Pesquisar na web..." onkeydown="if(event.key==='Enter') search()">
            <button class="search-btn" onclick="search()">Buscar</button>
        </div>
    </div>

<script>
let history = [];
let currentIndex = -1;
const frame = document.getElementById('browser-frame');
const homeView = document.getElementById('home-view');
const urlInput = document.getElementById('url-input');

function goHome() {
    frame.style.display = 'none';
    homeView.style.display = 'flex';
    urlInput.value = '';
    currentIndex = -1;
    updateButtons();
}

function navigate(url) {
    url = url || urlInput.value.trim();
    if (!url) return;
    
    // Normalizar URL
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
            url = 'https://' + url;
        } else {
            search(url);
            return;
        }
    }
    
    // LISTA DE SITES QUE BLOQUEIAM IFRAMES (atualizada)
    const blockedSites = [
        'google.com', 'youtube.com', 'facebook.com', 'instagram.com', 
        'twitter.com', 'x.com', 'linkedin.com', 'reddit.com', 'wikipedia.org', 'wikimedia.org',
        'duckduckgo.com', 'bing.com', 'yahoo.com', 'amazon.com',
        'netflix.com', 'spotify.com', 'github.com'
    ];
    
    const isBlocked = blockedSites.some(site => url.toLowerCase().includes(site));
    
    if (isBlocked) {
        console.log("⚠️ Site bloqueado detectado:", url);
        showBlockedPage(url);
        return;
    }
    
    // Site seguro: carregar normalmente
    if (currentIndex < history.length - 1) {
        history = history.slice(0, currentIndex + 1);
    }
    history.push(url);
    currentIndex++;
    
    frame.src = url;
    frame.style.display = 'block';
    homeView.style.display = 'none';
    document.getElementById('error-view').style.display = 'none';
    urlInput.value = url;
    updateButtons();
}

function showBlockedPage(url) {
    // Esconder iframe e home, mostrar página bloqueada
    frame.style.display = 'none';
    homeView.style.display = 'none';
    
    const errorView = document.getElementById('error-view');
    errorView.style.display = 'flex';
    
    // Atualizar conteúdo da página de erro
    errorView.innerHTML = `
        <div class="error-icon">🔒</div>
        <h2 class="error-title">Site Não Compatível com Iframe</h2>
        <p class="error-desc">
            O site <strong>${url}</strong> possui proteção de segurança (X-Frame-Options) 
            e não pode ser exibido dentro do ThinkinBrowser.<br><br>
            Isso é comum em buscadores, redes sociais e sites bancários.
        </p>
        <div class="error-actions">
            <button class="btn-primary" onclick="window.open('${url}', '_blank')">
                 Abrir no Navegador Externo
            </button>
            <button class="btn-secondary" onclick="goHome()">
                 Voltar ao Início
            </button>
        </div>
    `;
    
    // Adicionar ao histórico mesmo assim
    if (currentIndex < history.length - 1) {
        history = history.slice(0, currentIndex + 1);
    }
    history.push(url);
    currentIndex++;
    urlInput.value = url;
    updateButtons();
}

function search(query) {
    query = query || document.getElementById('search-input').value.trim();
    if (!query) return;
    navigate('https://www.google.com/search?q=' + encodeURIComponent(query));
}

function goBack() {
    if (currentIndex > 0) {
        currentIndex--;
        const url = history[currentIndex];
        frame.src = url;
        urlInput.value = url;
        updateButtons();
    }
}

function goForward() {
    if (currentIndex < history.length - 1) {
        currentIndex++;
        const url = history[currentIndex];
        frame.src = url;
        urlInput.value = url;
        updateButtons();
    }
}

function refresh() {
    if (frame.style.display !== 'none') {
        frame.src = frame.src;
    }
}

function updateButtons() {
    document.getElementById('btn-back').disabled = currentIndex <= 0;
    document.getElementById('btn-forward').disabled = currentIndex >= history.length - 1;
}

// Detectar falha no iframe (sites que bloqueiam X-Frame-Options)
frame.addEventListener('load', function() {
    try {
        // Tentar acessar o conteúdo do iframe. Se falhar (cross-origin), assume bloqueio
        // Nota: Alguns sites carregam mas ainda assim bloqueiam interação. 
        // Esta é uma heurística baseada em sites conhecidos ou tempo de resposta.
    } catch(e) {
        showError();
    }
});

// Fallback: Se o iframe ficar branco por muito tempo ou der erro de rede
let loadTimeout;
frame.addEventListener('load', () => {
    clearTimeout(loadTimeout);
    loadTimeout = setTimeout(() => {
        // Verificação simples: se src mudou mas conteúdo parece vazio/bloqueado
        // (Em produção real, usaríamos um proxy, mas aqui usamos UX)
    }, 3000);
});

function showError() {
    frame.style.display = 'none';
    homeView.style.display = 'none';
    document.getElementById('error-view').style.display = 'flex';
}

function openExternal() {
    const url = urlInput.value.trim();
    if (url) window.open(url, '_blank');
}

// Iniciar na home
goHome();
</script>
</body>
</html>
