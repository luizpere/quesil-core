<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IDE - ThinkinOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e1e; color: #d4d4d4;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #2d2d30; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #3e3e42;
        }
        .header h2 { font-size: 14px; font-weight: 600; color: #fff; }
        .btn {
            background: #0e639c; border: none; color: white;
            padding: 6px 14px; border-radius: 4px; cursor: pointer;
            font-size: 12px; margin-left: 8px; transition: background 0.2s;
        }
        .btn:hover { background: #1177bb; }
        .btn-close { background: #ff5f56; }
        .btn-close:hover { background: #ff7875; }

        .mode-selector {
            display: none; gap: 10px; margin-left: 20px;
        }
        .mode-selector.visible { display: flex; }
        .mode-btn {
            padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 11px; font-weight: 600; transition: all 0.2s;
        }
        .mode-btn.active { background: #007acc; color: #fff; }
        .mode-btn:not(.active) { background: #3c3c3c; color: #ccc; }
        .mode-btn:not(.active):hover { background: #4c4c4c; }

        .container { display: flex; flex: 1; overflow: hidden; }

        .file-explorer {
            width: 250px; background: #252526; border-right: 1px solid #3e3e42;
            overflow-y: auto; display: flex; flex-direction: column;
        }
        .explorer-header {
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #3e3e42;
        }
        .explorer-header h3 {
            font-size: 11px; text-transform: uppercase; color: #858585;
            margin: 0; letter-spacing: 1px;
        }
        .explorer-actions { display: flex; gap: 5px; }
        .icon-btn {
            background: transparent; border: none; color: #858585; cursor: pointer;
            font-size: 14px; padding: 4px; border-radius: 4px;
        }
        .icon-btn:hover { background: #3c3c3c; color: #fff; }
        .file-list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .file-explorer h3 {
            font-size: 11px; text-transform: uppercase; color: #858585;
            margin-bottom: 10px; letter-spacing: 1px;
        }
        .file-item {
            padding: 6px 10px; cursor: pointer; border-radius: 4px;
            font-size: 13px; color: #cccccc; margin-bottom: 2px;
            display: flex; align-items: center; gap: 8px;
        }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; color: #fff; }
        .file-icon { font-size: 14px; }

        .editor-area { flex: 1; display: flex; flex-direction: column; min-width: 400px; }
        .editor-tabs {
            background: #2d2d30; border-bottom: 1px solid #3e3e42;
            display: flex; overflow-x: auto;
        }
        .editor-tab {
            padding: 8px 15px; background: #2d2d30; color: #969696;
            border-right: 1px solid #3e3e42; cursor: pointer;
            font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 8px;
        }
        .editor-tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #007acc; }
        .editor-tab .close-tab {
            margin-left: 8px; opacity: 0.6; cursor: pointer;
        }
        .editor-tab .close-tab:hover { opacity: 1; color: #ff5f56; }

        #editor { flex: 1; }

        .preview-area {
            flex: 1; display: none; flex-direction: column;
            border-left: 1px solid #3e3e42; background: #ffffff;
            min-width: 300px;
        }
        .preview-header {
            background: #2d2d30; color: #fff; padding: 8px 15px; font-size: 12px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e3e42;
        }
        .preview-frame { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

        .git-panel {
            width: 280px; background: #252526; border-left: 1px solid #3e3e42;
            display: none; flex-direction: column; overflow-y: auto;
            flex-shrink: 0;
        }
        .git-panel.active { display: flex; }
        .git-header {
            padding: 15px; background: #333; font-weight: 600; color: #fff;
            border-bottom: 1px solid #3e3e42;
        }
        .git-section { padding: 10px; border-bottom: 1px solid #3e3e42; }
        .git-section h4 {
            font-size: 11px; color: #858585; margin-bottom: 10px; text-transform: uppercase;
        }
        .git-file {
            padding: 6px 10px; font-size: 12px; color: #ccc; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .git-file:hover { background: #2a2d2e; }
        .git-file.modified { color: #e2c08d; }
        .git-file.added { color: #89d185; }
        .git-file.deleted { color: #f48771; }
        .git-file.untracked { color: #58a6ff; }
        .git-actions { padding: 15px; }
        .git-input {
            width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px;
            border: 1px solid #3c3c3c; background: #3c3c3c; color: #fff;
            font-size: 12px; box-sizing: border-box;
        }
        .git-btn {
            width: 100%; padding: 8px; margin-bottom: 5px; border: none;
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .git-btn-primary { background: #0e639c; color: #fff; }
        .git-btn-primary:hover { background: #1177bb; }
        .git-btn-success { background: #238636; color: #fff; }
        .git-btn-success:hover { background: #2ea043; }
        .git-btn-secondary { background: #3c3c3c; color: #fff; }
        .git-btn-secondary:hover { background: #4c4c4c; }

        .status-bar {
            background: #007acc; color: white; padding: 4px 15px;
            font-size: 12px; display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>IDE - ThinkinOS</h2>
        <div class="mode-selector" id="mode-selector">
            <button class="mode-btn active" onclick="switchMode('dev')" id="mode-dev">Desenvolvimento</button>
            <button class="mode-btn" onclick="switchMode('workspace')" id="mode-workspace">Workspace Pessoal</button>
        </div>
        <div>
            <button class="btn" onclick="saveCurrentFile()">Salvar</button>
            <button class="btn" onclick="runFile()">Executar</button>
            <button class="btn" onclick="toggleGitPanel()" style="background: #6f42c1;">Git</button>
            <a href="/desktop" class="btn btn-close" style="text-decoration:none;">Fechar</a>
        </div>
    </div>

    <div class="container">
        <div class="file-explorer">
            <div class="explorer-header">
                <h3>WORKSPACE</h3>
                <div class="explorer-actions">
                    <button class="icon-btn" onclick="createNewItem('file')" title="Novo Arquivo">📄+</button>
                    <button class="icon-btn" onclick="createNewItem('folder')" title="Nova Pasta">📁+</button>
                </div>
            </div>
            <div class="file-list-container">
                <div id="file-list">Carregando...</div>
            </div>
        </div>

        <div class="editor-area">
            <div class="editor-tabs" id="editor-tabs"></div>
            <div id="editor"></div>
        </div>

        <div class="preview-area" id="preview-area">
            <div class="preview-header">
                <span>Live Preview</span>
                <button class="btn" onclick="updatePreview()" style="padding: 4px 10px; font-size: 11px; background: #238636;">Atualizar</button>
            </div>
            <iframe id="preview-frame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <div class="git-panel" id="git-panel">
            <div class="git-header">Controle de Versao</div>
            <div class="git-section">
                <h4>Mudancas</h4>
                <div id="git-files-list">
                    <p style="color: #858585; font-size: 12px; padding: 10px;">Carregando...</p>
                </div>
            </div>
            <div class="git-actions">
                <input type="text" id="git-message" class="git-input" placeholder="Mensagem do commit...">
                <button class="git-btn git-btn-primary" onclick="gitCommit()">Commit</button>
                <button class="git-btn git-btn-success" onclick="gitPush()">Push</button>
                <button class="git-btn git-btn-secondary" onclick="gitPull()">Pull</button>
                <button class="git-btn git-btn-secondary" onclick="refreshGitStatus()">Atualizar</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="status-file">Nenhum arquivo aberto</span>
        <span id="status-lang">Python</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let currentFile = null;
        let openTabs = [];
        let previewArea, previewFrame;
        let currentMode = 'dev';

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '# Bem-vindo a IDE ThinkinOS!\n\n# Selecione um arquivo na barra lateral para comecar.',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
                wordWrap: 'on'
            });

            previewArea = document.getElementById('preview-area');
            previewFrame = document.getElementById('preview-frame');
            console.log('Monaco e Preview inicializados');

            checkUserAndShowModeSelector();
            loadFiles();
        });

        function updatePreview() {
            if (!currentFile || !previewFrame || !editor) return;
            let content = editor.getValue();
            if (currentFile.endsWith('.css')) {
                content = '<style>' + content + '</style><h2>Preview de CSS</h2>';
            } else if (currentFile.endsWith('.js')) {
                content = '<script>' + content + '<\/script><h2>Preview de JS</h2>';
            }
            previewFrame.srcdoc = content;
        }

        async function checkUserAndShowModeSelector() {
            try {
                const res = await fetch('/api/user/info');
                const data = await res.json();
                if (data.username && ['lps', 'luiz'].includes(data.username.toLowerCase())) {
                    document.getElementById('mode-selector').classList.add('visible');
                }
            } catch(e) {
                console.log('Nao foi possivel verificar usuario');
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');
            openTabs = [];
            currentFile = null;
            updateTabs();
            loadFiles();
        }

        function loadFiles() {
            console.log('Carregando arquivos no modo:', currentMode);
            fetch('/api/workspace/files?mode=' + currentMode)
                .then(res => res.json())
                .then(data => {
                    console.log('Dados:', data);
                    const fileList = document.getElementById('file-list');
                    if (data.success && data.files && data.files.length > 0) {
                        fileList.innerHTML = data.files.map(f => 
                            '<div class="file-item" onclick="openFile(\'' + f.path + '\', \'' + f.name + '\')">' +
                            '<span class="file-icon">' + getFileIcon(f.name) + '</span>' +
                            '<span>' + f.name + '</span></div>'
                        ).join('');
                        console.log(data.files.length + ' arquivos carregados');
                    } else {
                        fileList.innerHTML = '<p style="color:#858585;font-size:12px;">Nenhum arquivo</p>';
                    }
                })
                .catch(e => {
                    console.error('Erro:', e);
                    document.getElementById('file-list').innerHTML = '<p style="color:#f48771;">Erro ao carregar</p>';
                });
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.py')) return 'PY';
            if (filename.endsWith('.js')) return 'JS';
            if (filename.endsWith('.html')) return 'HTML';
            if (filename.endsWith('.css')) return 'CSS';
            if (filename.endsWith('.json')) return 'JSON';
            if (filename.endsWith('.md')) return 'MD';
            return 'FILE';
        }

        function openFile(path, name) {
            fetch('/api/workspace/file?mode=' + currentMode + '&path=' + encodeURIComponent(path))
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentFile = path;
                        editor.setValue(data.content);
                        let lang = 'plaintext';
                        if (path.endsWith('.py')) lang = 'python';
                        else if (path.endsWith('.js')) lang = 'javascript';
                        else if (path.endsWith('.html')) lang = 'html';
                        else if (path.endsWith('.css')) lang = 'css';
                        else if (path.endsWith('.json')) lang = 'json';
                        monaco.editor.setModelLanguage(editor.getModel(), lang);
                        document.getElementById('status-file').textContent = path;
                        document.getElementById('status-lang').textContent = lang.toUpperCase();
                        if (previewArea) {
                            if (path.endsWith('.html') || path.endsWith('.css') || path.endsWith('.js')) {
                                previewArea.style.display = 'flex';
                                setTimeout(updatePreview, 300);
                            } else {
                                previewArea.style.display = 'none';
                            }
                        }
                        if (!openTabs.includes(path)) {
                            openTabs.push(path);
                            updateTabs();
                        }
                        document.querySelectorAll('.file-item').forEach(el => {
                            el.classList.remove('active');
                            if (el.getAttribute('onclick').includes(path)) el.classList.add('active');
                        });
                    } else {
                        alert('Erro: ' + data.error);
                    }
                })
                .catch(e => alert('Erro ao abrir: ' + e.message));
        }

        function updateTabs() {
            document.getElementById('editor-tabs').innerHTML = openTabs.map(path => {
                const name = path.split('/').pop();
                const isActive = path === currentFile ? 'active' : '';
                return '<div class="editor-tab ' + isActive + '" onclick="switchTab(\'' + path + '\')">' +
                    '<span>' + name + '</span>' +
                    '<span class="close-tab" onclick="closeTab(event, \'' + path + '\')">×</span></div>';
            }).join('');
        }

        function switchTab(path) { openFile(path, path.split('/').pop()); }

        function closeTab(event, path) {
            event.stopPropagation();
            openTabs = openTabs.filter(p => p !== path);
            if (currentFile === path) {
                currentFile = openTabs.length > 0 ? openTabs[openTabs.length - 1] : null;
                if (currentFile) openFile(currentFile, currentFile.split('/').pop());
                else {
                    editor.setValue('# Selecione um arquivo');
                    document.getElementById('status-file').textContent = 'Nenhum arquivo aberto';
                }
            }
            updateTabs();
        }

        function saveCurrentFile() {
            if (!currentFile) { alert('Nenhum arquivo aberto!'); return; }
            fetch('/api/workspace/file?mode=' + currentMode, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ path: currentFile, content: editor.getValue() })
            }).then(res => res.json()).then(data => {
                alert(data.success ? 'Salvo!' : 'Erro: ' + data.error);
            }).catch(e => alert('Erro: ' + e.message));
        }

        function runFile() {
            if (!currentFile || !currentFile.endsWith('.py')) {
                alert('Selecione um arquivo Python!'); return;
            }
            fetch('/api/workspace/terminal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ command: 'python3 ' + currentFile })
            }).then(res => res.json()).then(data => {
                alert(data.success ? 'Executado!\n\n' + data.output : 'Erro: ' + data.error);
            }).catch(e => alert('Erro: ' + e.message));
        }

        function toggleGitPanel() {
            const panel = document.getElementById('git-panel');
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
            } else {
                panel.classList.add('active');
                refreshGitStatus();
            }
        }

        async function refreshGitStatus() {
            try {
                const res = await fetch('/api/git/status');
                const data = await res.json();
                const fileList = document.getElementById('git-files-list');
                if (data.success && data.files && data.files.length > 0) {
                    fileList.innerHTML = data.files.map(f => {
                        const fileName = f.file || f.path || 'desconhecido';
                        const status = (f.status || '').trim();
                        
                        let statusClass = '';
                        let statusText = '';
                        
                        if (status === 'M' || status === 'M ' || status === 'MM') {
                            statusClass = 'modified';
                            statusText = 'Modificado';
                        } else if (status === 'A' || status === 'A ' || status === 'AM' || status === 'M ') {
                            statusClass = 'added';
                            statusText = 'Adicionado';
                        } else if (status === '??' || status === 'U') {
                            statusClass = 'untracked';
                            statusText = 'Novo';
                        } else if (status === 'D' || status === 'D ' || status === 'AD') {
                            statusClass = 'deleted';
                            statusText = 'Excluído';
                        } else {
                            statusClass = 'modified';
                            statusText = status || 'Alterado';
                        }
                        
                        return '<div class="git-file ' + statusClass + '">' +
                            '<span>' + fileName + '</span>' +
                            '<span style="font-size: 10px; opacity: 0.7;">' + statusText + '</span>' +
                        '</div>';
                    }).join('');
                } else {
                    fileList.innerHTML = '<p style="color: #858585; font-size: 12px; padding: 10px;">Nenhuma mudança pendente</p>';
                }
            } catch(e) {
                console.error('Erro ao carregar status do Git:', e);
            }
        }

        async function gitCommit() {
            const message = document.getElementById('git-message').value;
            if (!message.trim()) {
                alert('Por favor, digite uma mensagem de commit!');
                return;
            }
            try {
                const res = await fetch('/api/git/commit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message})
                });
                const data = await res.json();
                if (data.success) {
                    alert('Commit realizado com sucesso!');
                    document.getElementById('git-message').value = '';
                    refreshGitStatus();
                } else {
                    alert('Erro no commit: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao fazer commit: ' + e.message);
            }
        }

        async function gitPush() {
            if (!confirm('Enviar alteracoes para o GitHub?')) return;
            try {
                const res = await fetch('/api/git/push', {method: 'POST'});
                const data = await res.json();
                if (data.success) {
                    alert('Push realizado com sucesso!');
                    refreshGitStatus();
                } else {
                    alert('Erro no push: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao fazer push: ' + e.message);
            }
        }

        async function gitPull() {
            if (!confirm('Baixar alteracoes do GitHub?')) return;
            try {
                const res = await fetch('/api/git/pull', {method: 'POST'});
                const data = await res.json();
                if (data.success) {
                    alert('Pull realizado com sucesso!');
                    refreshGitStatus();
                } else {
                    alert('Erro no pull: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao fazer pull: ' + e.message);
            }
        }
    
        // === FUNÇÕES DE GERENCIAMENTO DE ARQUIVOS ===
        async function createNewItem(type) {
            const name = prompt(type === 'file' ? 'Nome do novo arquivo (ex: teste.html):' : 'Nome da nova pasta:');
            if (!name) return;
            
            try {
                const res = await fetch('/api/workspace/create?mode=' + currentMode, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path: name, is_dir: type === 'folder' })
                });
                const data = await res.json();
                if (data.success) {
                    loadFiles();
                    // Se criou um arquivo (não pasta), abre automaticamente
                    if (type === 'file') {
                        setTimeout(() => openFile(name, name.split('/').pop()), 500);
                    }
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao criar: ' + e.message);
            }
        }

        async function deleteFile(path) {
            if (!confirm('Tem certeza que deseja excluir ' + path + '?')) return;
            try {
                const res = await fetch('/api/workspace/file?mode=' + currentMode + '&path=' + encodeURIComponent(path), {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.success) {
                    if (currentFile === path) {
                        currentFile = null;
                        editor.setValue('');
                        updateTabs();
                    }
                    loadFiles();
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao excluir: ' + e.message);
            }
        }

        async function renameFile(path) {
            const newName = prompt('Novo nome para ' + path.split('/').pop() + ':', path.split('/').pop());
            if (!newName || newName === path.split('/').pop()) return;
            
            try {
                const res = await fetch('/api/workspace/rename?mode=' + currentMode, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ old_path: path, new_name: newName })
                });
                const data = await res.json();
                if (data.success) {
                    loadFiles();
                } else {
                    alert('Erro: ' + data.error);
                }
            } catch(e) {
                alert('Erro ao renomear: ' + e.message);
            }
        }

    </script>
</body>
</html>
