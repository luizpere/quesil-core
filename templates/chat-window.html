<div id="daily-challenge-card" style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); border-radius: 8px; padding: 15px; margin: 15px; color: white; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">

<script>
// Carregar desafio ao iniciar
async function loadDailyChallenge() {
    try {
        const res = await fetch(`/api/challenge?nivel=${window.nivel}`);
        const data = await res.json();
        document.getElementById('challenge-title').textContent = data.title;
        document.getElementById('challenge-desc').textContent = data.description;
        document.getElementById('daily-challenge-card').dataset.code = data.starter_code;
        document.getElementById('daily-challenge-card').style.display = 'block';
    } catch(e) {
        console.error('Erro ao carregar desafio:', e);
    }
}

// Função para abrir no editor
function startChallenge() {
    const code = document.getElementById('daily-challenge-card').dataset.code;
    localStorage.setItem('thinkinos_challenge_code', code);
    localStorage.setItem('thinkinos_challenge_title', document.getElementById('challenge-title').textContent);
    window.location.href = '/editor';
}

// Chamar ao carregar a página
document.addEventListener('DOMContentLoaded', loadDailyChallenge);
</script>

    <script>
        // 1. CONFIGURAÇÃO DE CORES E NOME
        const params = new URLSearchParams(window.location.search);
        const assistant = params.get('assistant') || 'Ana';
        window.nivel = params.get('nivel') || 'leigo';
        const colors = { 
            "Ana": "#ff6b9d",      // Rosa
            "Carlos": "#4facfe",   // Azul
            "Lena": "#00f2fe",     // Ciano
            "Pedro": "#43e97b",    // Verde
            "ThinkinIA": "#9d4edd" // Roxo (corrigido)
        };
        const color = colors[assistant] || '#7c4dff';
        
        document.documentElement.style.setProperty('--agent-color', color);
        
        const selectElement = document.getElementById('agent-select');
        if (selectElement) {
            selectElement.value = assistant;
            selectElement.style.color = colors[assistant] || '#ffffff';
            selectElement.addEventListener('change', function() {
                const url = new URL(window.location.href);
                url.searchParams.set('assistant', this.value);
                window.location.href = url.toString(); // Recarrega com o novo assistente
            });
        }

        document.title = `Chat com ${assistant}`;

        // 2. LÓGICA DE CHAT
        const inputElement = document.getElementById('prompt');
        inputElement.addEventListener('keypress', e => e.key === 'Enter' && send());

        async function send() {
            const msg = inputElement.value.trim();
            if (!msg) return;
            
            const area = document.getElementById('messages');
            if (!area) {
                alert("❌ Elemento #messages NÃO ENCONTRADO!");
                return;
            }
            
            
            
            
            
            // 1. Adiciona a mensagem do usuário na tela IMEDIATAMENTE com estilo FORÇADO
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = msg;
            
            area.appendChild(userDiv);
            
            
            
            // Forçar visibilidade do container
            area.style.display = 'flex';
            area.style.visibility = 'visible';
            area.style.height = '400px';
            area.style.overflowY = 'auto';
             // Fundo vermelho claro para visualizar
            
            
            
            // Limpa o input
            inputElement.value = '';
            
            // Scroll para o final
            area.scrollTop = area.scrollHeight;
            
            // 2. Mostra um indicador de "Digitando..."
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-msg';
            loadingDiv.id = 'loading-msg';
            loadingDiv.textContent = 'Digitando...';
            area.appendChild(loadingDiv);
            area.scrollTop = area.scrollHeight;

            try {
                // 3. Chama o backend
                const res = await fetch('/api/chat', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: msg, assistant: assistant })
                });
                
                if (!res.ok) throw new Error('HTTP error');
                
                const data = await res.json();
                
                // 4. Remove o "Digitando..." e adiciona a resposta real
                const loading = document.getElementById('loading-msg');
                if (loading) loading.remove();
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';
                aiDiv.textContent = data.response || data.error || 'Sem resposta.';
                area.appendChild(aiDiv);
                
            } catch(e) {
                console.error("Erro na requisição:", e);
                const loading = document.getElementById('loading-msg');
                if (loading) loading.remove();
                
                const errDiv = document.createElement('div');
                errDiv.className = 'message ai-msg';
                errDiv.style.color = '#ff5f56';
                errDiv.textContent = 'Falha na conexão.';
                area.appendChild(errDiv);
            }
            
            // Scroll final
            area.scrollTop = area.scrollHeight;
        }

    </script>

<script>
// Lógica do Painel de Histórico
function toggleHistory() {
    const panel = document.getElementById('history-panel');
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    if (panel.style.display === 'flex') loadHistory();
}

async function loadHistory() {
    // Pega nome do assistente da URL ou usa padrão
    const params = new URLSearchParams(window.location.search);
    const assistant = params.get('assistant') || 'Ana';
        window.nivel = params.get('nivel') || 'leigo';
    
    try {
        const res = await fetch(`/api/history/${assistant}`);
        const data = await res.json();
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        if (!data.messages.length) {
            list.innerHTML = '<p style="opacity:0.6; text-align:center;">Nenhuma conversa salva ainda.</p>';
            return;
        }
        
        data.messages.forEach(msg => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-user">Você: ${msg.user_msg}</div>
                <div class="history-ai">${msg.ai_response}</div>
                <div class="history-time">${new Date(msg.timestamp).toLocaleString('pt-BR')}</div>
            `;
            list.appendChild(item);
        });
    } catch(e) { console.error("Erro ao carregar histórico:", e); }
}

async function clearHistory() {
    if (!confirm("Tem certeza que deseja apagar todo o histórico?")) return;
    const params = new URLSearchParams(window.location.search);
    const assistant = params.get('assistant') || 'Ana';
        window.nivel = params.get('nivel') || 'leigo';
    
    try {
        await fetch(`/api/history/clear/${assistant}`, { method: 'DELETE' });
        loadHistory(); // Recarrega lista vazia
    } catch(e) { alert("Erro ao limpar histórico!"); }
}

// Botão de histórico já está na barra (HTML estático)
// Não precisa criar dinamicamente
</script>


<script>
// ===== CONTROLES DE JANELA FUNCIONAIS (v6 - Forçar Tela Cheia) =====
window.chatMinimized = false;
window.chatMaximized = false;

window.toggleChatMinimize = function() {
    window.chatMinimized = !window.chatMinimized;
    const chatArea = document.getElementById('messages');
    const inputContainer = document.querySelector('.input-container');
    if (window.chatMinimized) {
        if (chatArea) chatArea.style.display = 'none';
        if (inputContainer) inputContainer.style.display = 'none';
    } else {
        if (chatArea) chatArea.style.display = 'block';
        if (inputContainer) inputContainer.style.display = 'flex';
    }
};

window.toggleChatMaximize = function() {
    window.chatMaximized = !window.chatMaximized;
    
    if (window.chatMaximized) {
        // Aplicar modo tela cheia no BODY inteiro
        document.body.classList.add('thinkin-fullscreen-mode');
        document.body.style.position = 'fixed';
        document.body.style.top = '0';
        document.body.style.left = '0';
        document.body.style.width = '100vw';
        document.body.style.height = '100vh';
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.body.style.overflow = 'hidden';
        document.body.style.zIndex = '999999';
        
        // Esconder elementos desnecessários
        const navBar = document.querySelector('.nav-bar');

    } else {

        document.body.classList.remove('thinkin-fullscreen-mode');

        document.body.style.margin = '';

<script>
// Função para mostrar o Diário
function showMyDiary() {
    // Criar modal do Diário
    let modal = document.getElementById('diary-modal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'diary-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;';
        modal.innerHTML = `
            <div style="background:#1e1e2e;padding:30px;border-radius:12px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid rgba(255,107,157,0.5);">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="color:#ff6b9d;margin:0;">📖 Meu Diário</h2>
                    <button onclick="document.getElementById('diary-modal').remove()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;">×</button>
                </div>
                <div id="diary-entries">
                    <p style="color:#888;text-align:center;">Carregando entradas...</p>
                </div>
                <textarea id="new-diary-entry" placeholder="Escreva uma nova entrada..." style="width:100%;min-height:100px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px;color:white;font-size:14px;margin-top:15px;resize:vertical;"></textarea>
                <button onclick="saveDiaryEntry()" style="background:#ff6b9d;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:10px;width:100%;">💾 Salvar Entrada</button>
            </div>
        `;
        document.body.appendChild(modal);
        loadDiaryEntries();
    }
}

async function loadDiaryEntries() {
    try {
        const res = await fetch('/api/diary');
        const data = await res.json();
        const container = document.getElementById('diary-entries');
        if (data.entries && data.entries.length > 0) {
            container.innerHTML = data.entries.map(e => `
                <div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ff6b9d;">
                    <div style="font-size:11px;color:#888;margin-bottom:5px;">${new Date(e.timestamp).toLocaleString('pt-BR')}</div>
                    <div style="font-size:14px;line-height:1.5;">${e.content}</div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p style="color:#888;text-align:center;">Nenhuma entrada ainda. Comece escrevendo abaixo!</p>';
        }
    } catch(e) {
        document.getElementById('diary-entries').innerHTML = '<p style="color:#f48771;">Erro ao carregar diário.</p>';
    }
}

async function saveDiaryEntry() {
    const content = document.getElementById('new-diary-entry').value.trim();
    if (!content) return alert('Escreva algo primeiro!');
    try {
        await fetch('/api/diary', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: content})
        });
        document.getElementById('new-diary-entry').value = '';
        loadDiaryEntries();
    } catch(e) {
        alert('Erro ao salvar!');
    }
}

// Atualizar streak dinamicamente
async function updateStreakDisplay() {
    try {
        const response = await fetch('/api/streak');
        const data = await response.json();
        if (data.success) {
            const streakEl = document.getElementById('streak-indicator');
            if (streakEl) {
                const dias = data.current_streak || 1;
                streakEl.textContent = ' ' + dias + (dias === 1 ? ' dia' : ' dias');
            }
        }
    } catch (err) {
        console.log('Erro ao atualizar streak:', err);
    }
}

// Carregar streak ao iniciar
window.addEventListener('load', updateStreakDisplay);
