<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGradA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
    <linearGradient id="ringGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#764ba2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="starGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#a8c0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulse1 {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes pulse2 {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .star1 { animation: pulse1 3s ease-in-out infinite; transform-origin: 140px 180px; }
      .star2 { animation: pulse2 4s ease-in-out infinite; transform-origin: 200px 180px; }
      .star3 { animation: pulse1 3.5s ease-in-out infinite; transform-origin: 260px 180px; }
      .ring { animation: rotate 60s linear infinite; transform-origin: 200px 180px; }
    </style>
  </defs>
  <circle cx="200" cy="180" r="170" fill="url(#bgGradA)"/>
  <g class="ring">
    <ellipse cx="200" cy="180" rx="140" ry="50" fill="none" stroke="url(#ringGradA)" stroke-width="1.5" transform="rotate(-15 200 180)" opacity="0.6"/>
  </g>
  <g class="star1">
    <circle cx="140" cy="180" r="18" fill="url(#starGlowA)"/>
    <circle cx="140" cy="180" r="5" fill="#ffffff"/>
  </g>
  <g class="star2">
    <circle cx="200" cy="180" r="22" fill="url(#starGlowA)"/>
    <circle cx="200" cy="180" r="6" fill="#ffffff"/>
  </g>
  <g class="star3">
    <circle cx="260" cy="180" r="18" fill="url(#starGlowA)"/>
    <circle cx="260" cy="180" r="5" fill="#ffffff"/>
  </g>
  <text x="200" y="290" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">QUESIL CORE</text>
  <text x="200" y="315" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="300" fill="#a8c0ff" text-anchor="middle" letter-spacing="4">AI ORCHESTRATION PLATFORM</text>
</svg>
