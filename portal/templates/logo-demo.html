<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quesil Core - Logo Demo</title>
    <link rel="icon" type="image/svg+xml" href="/portal/static/images/logo/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #a8c0ff;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .card h3 {
            margin: 20px 0 10px;
            color: #a8c0ff;
            font-size: 1.2rem;
        }
        .card p {
            color: #8892b0;
            font-size: 0.9rem;
        }
        .card img {
            max-width: 100%;
            height: auto;
        }
        .light-card {
            background: #f5f5f5;
            border-color: #ddd;
        }
        .light-card h3 { color: #2a3a6e; }
        .light-card p { color: #666; }
        .hero-logo {
            text-align: center;
            margin: 60px 0;
        }
        .hero-logo img {
            max-width: 400px;
            filter: drop-shadow(0 0 30px rgba(102, 126, 234, 0.5));
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #667eea;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: rgba(102, 126, 234, 0.4);
        }
        .center { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 Quesil Core</h1>
        <p class="subtitle">Kit de Identidade Visual — Constelação de Órion</p>
        
        <!-- Logo Animado em Destaque -->
        <div class="hero-logo">
            <img src="/portal/static/images/logo/animated.svg" alt="Quesil Core Animated">
            <p style="margin-top: 20px; color: #a8c0ff;">Versão Animada (CSS)</p>
        </div>
        
        <div class="grid">
            <div class="card">
                <img src="/portal/static/images/logo/dark.svg" alt="Dark Version">
                <h3>Versão Dark</h3>
                <p>Para fundos escuros e temas noturnos</p>
            </div>
            
            <div class="card light-card">
                <img src="/portal/static/images/logo/light.svg" alt="Light Version">
                <h3>Versão Light</h3>
                <p>Para fundos claros e documentação</p>
            </div>
            
            <div class="card">
                <img src="/portal/static/images/logo/horizontal.svg" alt="Horizontal Version">
                <h3>Versão Horizontal</h3>
                <p>Para headers e barras de navegação</p>
            </div>
            
            <div class="card">
                <img src="/portal/static/images/logo/favicon.svg" alt="Favicon" style="width: 128px;">
                <h3>Favicon</h3>
                <p>3 estrelas — Aba do navegador</p>
            </div>
        </div>
        
        <div class="center">
            <a href="/portal" class="back-link">← Voltar ao Portal</a>
        </div>
    </div>
</body>
</html>
