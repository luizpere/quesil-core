{% extends "portal/base.html" %}
{% block title %}{{ doc.title }} - ThinkinOS{% endblock %}
{% block content %}
<section class="hero" style="padding: 3rem 0;">
    <div class="container">
        <a href="{{ url_for('portal.docs') }}" style="color: var(--gray); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Voltar para Documentação</a>
        <h1>{{ doc.title }}</h1>
    </div>
</section>
<section class="content-section">
    <div class="container" style="max-width: 800px;">
        <div style="background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); line-height: 1.8;">
            {{ doc.content | safe }}
        </div>
    </div>
</section>
{% endblock %}
