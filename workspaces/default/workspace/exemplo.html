<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Workspace pessoal e centro de produtividade">
    <title>ThinkinOS - Workspace Pessoal</title>
    <style>
        /* CSS reset básico e tipografia moderna */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            border-bottom: 3px solid #3498db;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        main p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #34495e;
            color: #ecf0f1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header semântico -->

        <h1>ThinkinOS</h1>
